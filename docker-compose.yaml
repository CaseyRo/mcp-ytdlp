services:
  mcp-ytdlp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-ytdlp
    ports:
      # Bind to the host's tailnet IP, never 0.0.0.0: Docker publishes 0.0.0.0 past ufw,
      # so only the Hetzner firewall would stand in front of it. BIND_IP comes from the
      # Komodo stack environment (nebula-1: its tailnet IP). Unset = compose refuses to
      # render, so the running container is left alone. Do NOT use 127.0.0.1: cloudflared
      # (host network) reaches this port via the tailnet IP. See fleet-stacks SECURITY.md.
      - "${BIND_IP:?set BIND_IP (tailnet IP) in the stack environment}:${HOST_PORT:-8718}:8000"
    environment:
      OUTPUT_DIRECTORY: ${OUTPUT_DIRECTORY:-/data}
      CLEANUP_RETENTION_DAYS: ${CLEANUP_RETENTION_DAYS:-7}
      # Cap id to 60 chars so generic-extractor URLs (signed CDN links,
      # 300+ chars) don't trip Errno 36 "File name too long" on ext4/APFS.
      VIDEO_FILENAME_FORMAT: ${VIDEO_FILENAME_FORMAT:-%(extractor_key)s-%(id).60s.%(ext)s}
      MCP_API_KEY: ${MCP_API_KEY:-}
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - ${OUTPUT_HOST_DIR:-ytdlp_output}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ytdlp_output:
