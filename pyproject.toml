[project]
name = "mcp-ytdlp"
version = "0.2.24"
description = "FastMCP server for downloading and converting videos via yt-dlp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "CaseyRo"}]
keywords = ["mcp", "fastmcp", "yt-dlp", "youtube", "video", "download"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastmcp>=4.0.10,<5.0.0",
  "yt-dlp>=2026.6.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  # Security floors (transitive deps of fastmcp; pinned to address CVEs)
  "authlib>=1.7.0",            # GHSA: CSRF in token cache handling
  "python-multipart>=0.0.27",  # GHSA: DoS via unbounded multipart headers
]

[project.urls]
"Homepage" = "https://github.com/CaseyRo/mcp-ytdlp"
"Bug Tracker" = "https://github.com/CaseyRo/mcp-ytdlp/issues"

[project.scripts]
mcp-ytdlp = "mcp_ytdlp.server:main"

[dependency-groups]
dev = ["ruff>=0.8.0", "pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ytdlp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
# Pinned rather than inherited: ruff's default rule set widens between releases,
# so a dev-tools bump could turn a clean tree red (CDI-1783). Same set fleet-wide.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
# UP042 (str+Enum -> StrEnum) changes str() of enum values, which can be persisted or on the wire: fleet decision is no.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from CDiT-infrastructure/scripts/mcp_usage_middleware.py; re-copy, never edit here.
# Its noqa directives (UP017, BLE001, S110) serve repos with other rule sets.
"src/mcp_ytdlp/usage.py" = ["RUF100", "UP017"]
